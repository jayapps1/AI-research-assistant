spring:
  application:
    name: research-assistant-api

  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:research_assist}?sslmode=${DB_SSLMODE:disable}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 105MB

  cache:
    type: simple

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      database: ${REDIS_DATABASE:0}
      repositories:
        enabled: false

  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:${AI_GENERATION_PROVIDER:openai}}
      embedding: ${SPRING_AI_MODEL_EMBEDDING:${AI_EMBEDDING_PROVIDER:${AI_EMBEDDINGS_PROVIDER:none}}}
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${AI_GENERATION_MODEL:gpt-4o-mini}
      embedding:
        options:
          model: ${AI_EMBEDDING_MODEL:${AI_EMBEDDINGS_MODEL:text-embedding-3-small}}

    vectorstore:
      type: none

server:
  port: ${PORT:8096}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

  health:
    redis:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

app:
  seed:
    super-admin:
      enabled: ${SUPERADMIN_SEED_ENABLED:false}
      email: ${SUPERADMIN_EMAIL:nanagyachie@gmail.com}
      phone: ${SUPERADMIN_PHONE:0542011738}
      password: ${SUPERADMIN_PASSWORD:}
  api:
    allowed-origins: ${API_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175}
    max-page-size: ${API_MAX_PAGE_SIZE:100}
    hsts-enabled: ${API_HSTS_ENABLED:false}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:false}
    general-per-minute: ${RATE_LIMIT_GENERAL_PER_MINUTE:600}
    sensitive-per-minute: ${RATE_LIMIT_SENSITIVE_PER_MINUTE:120}
  cache:
    provider: ${CACHE_PROVIDER:simple}
    key-prefix: ${REDIS_KEY_PREFIX:research-assistant:v1:}
    project-metadata-ttl: ${CACHE_PROJECT_METADATA_TTL:PT5M}
    document-metadata-ttl: ${CACHE_DOCUMENT_METADATA_TTL:PT5M}
    literature-summary-ttl: ${CACHE_LITERATURE_SUMMARY_TTL:PT5M}
    research-design-validation-ttl: ${CACHE_RESEARCH_DESIGN_VALIDATION_TTL:PT1M}
  backup:
    enabled: ${BACKUP_ENABLED:false}
    root-directory: ${BACKUP_ROOT_DIR:./data/backups}
    retention:
      daily: ${BACKUP_RETENTION_DAILY:7}
      weekly: ${BACKUP_RETENTION_WEEKLY:4}
      monthly: ${BACKUP_RETENTION_MONTHLY:12}
    verification:
      required: ${BACKUP_VERIFICATION_REQUIRED:true}
      freshness-grace: ${BACKUP_FRESHNESS_GRACE:PT6H}
    target:
      rpo-minutes: ${BACKUP_TARGET_RPO_MINUTES:1440}
      rto-minutes: ${BACKUP_TARGET_RTO_MINUTES:240}
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: research-assistant-api
      access-token-minutes: 15
      refresh-token-days: 30
    credentials:
      encryption-key: ${CREDENTIAL_ENCRYPTION_KEY}
    totp:
      issuer: ${TOTP_ISSUER:AI Research Assistant}
  document:
    # 50 MiB per file (50 * 1024 * 1024 bytes). Keep Spring multipart max-file-size in sync.
    max-upload-size-bytes: ${DOCUMENT_MAX_UPLOAD_SIZE_BYTES:52428800}
    storage:
      type: local
      local-directory: ${DOCUMENT_STORAGE_DIR:./data/documents}
    chunking:
      target-characters: ${DOCUMENT_CHUNK_TARGET_CHARACTERS:3000}
      overlap-characters: ${DOCUMENT_CHUNK_OVERLAP_CHARACTERS:300}
      minimum-characters: ${DOCUMENT_CHUNK_MINIMUM_CHARACTERS:200}
    processing:
      auto-process-after-upload: ${DOCUMENT_AUTO_PROCESS_AFTER_UPLOAD:true}
      worker-delay-ms: ${DOCUMENT_WORKER_DELAY_MS:5000}
  collaboration:
    invitation-ttl: ${PROJECT_INVITATION_TTL:P7D}
  ai:
    development-budget:
      enabled: ${AI_DEV_BUDGET_ENABLED:true}
      limit-usd: ${AI_DEV_BUDGET_USD:4.00}
    generation:
      enabled: ${AI_GENERATION_ENABLED:true}
      provider: ${AI_GENERATION_PROVIDER:openai}
      model: ${AI_GENERATION_MODEL:gpt-4o-mini}
      temperature: ${AI_GENERATION_TEMPERATURE:0.2}
      max-output-tokens: ${AI_GENERATION_MAX_OUTPUT_TOKENS:4096}
      timeout: ${AI_GENERATION_TIMEOUT:PT60S}
    embedding:
      enabled: ${AI_EMBEDDING_ENABLED:${AI_EMBEDDINGS_ENABLED:false}}
      provider: ${AI_EMBEDDING_PROVIDER:${AI_EMBEDDINGS_PROVIDER:none}}
      model: ${AI_EMBEDDING_MODEL:${AI_EMBEDDINGS_MODEL:text-embedding-3-small}}
      dimensions: ${AI_EMBEDDING_DIMENSIONS:${AI_EMBEDDINGS_DIMENSIONS:}}
      batch-size: ${AI_EMBEDDING_BATCH_SIZE:${AI_EMBEDDINGS_BATCH_SIZE:64}}
      timeout: ${AI_EMBEDDING_TIMEOUT:PT60S}
    retrieval:
      lexical-enabled: true
      semantic-enabled: ${AI_SEMANTIC_RETRIEVAL_ENABLED:false}
    privacy:
      external-research-content-enabled: ${AI_EXTERNAL_RESEARCH_CONTENT_ENABLED:true}

  integrity:
    similarity:
      provider: ${SIMILARITY_PROVIDER:none}
  retrieval:
    lexical-candidates: ${RETRIEVAL_LEXICAL_CANDIDATES:40}
    semantic-candidates: ${RETRIEVAL_SEMANTIC_CANDIDATES:40}
    fusion-candidates: ${RETRIEVAL_FUSION_CANDIDATES:60}
    rerank-candidates: ${RETRIEVAL_RERANK_CANDIDATES:30}
    final-limit: ${RETRIEVAL_FINAL_LIMIT:10}
    max-limit: ${RETRIEVAL_MAX_LIMIT:50}
    rrf-k: ${RETRIEVAL_RRF_K:60}
  rag:
    evidence:
      max-items: ${RAG_EVIDENCE_MAX_ITEMS:12}
      max-total-characters: ${RAG_EVIDENCE_MAX_TOTAL_CHARACTERS:30000}
      max-item-characters: ${RAG_EVIDENCE_MAX_ITEM_CHARACTERS:6000}
      minimum-items: ${RAG_EVIDENCE_MINIMUM_ITEMS:1}
    generation:
      enabled: ${AI_GENERATION_ENABLED:true}
      provider: ${AI_GENERATION_PROVIDER:openai}
      model: ${AI_GENERATION_MODEL:gpt-4o-mini}
    conversation:
      context-turns: ${RAG_CONVERSATION_CONTEXT_TURNS:6}
  payment:
    paystack:
      enabled: ${PAYSTACK_ENABLED:true}
      mode: ${PAYSTACK_MODE:test}
      secret-key: ${PAYSTACK_SECRET_KEY:}
      public-key: ${PAYSTACK_PUBLIC_KEY:}
      callback-base-url: ${PAYSTACK_CALLBACK_BASE_URL:http://localhost:8096}
      live-enabled: ${PAYSTACK_LIVE_ENABLED:false}
      connect-timeout: ${PAYSTACK_CONNECT_TIMEOUT:PT10S}
      read-timeout: ${PAYSTACK_READ_TIMEOUT:PT30S}
      max-attempts-per-intent: ${PAYMENT_MAX_ATTEMPTS_PER_INTENT:5}
      retry-cooldown: ${PAYMENT_RETRY_COOLDOWN:PT15S}
      intent-ttl: ${PAYMENT_INTENT_TTL:PT24H}
      attempt-ttl: ${PAYMENT_ATTEMPT_TTL:PT30M}
  subscription:
    renewal-reminders:
      enabled: ${SUBSCRIPTION_RENEWAL_REMINDERS_ENABLED:true}
      days-before: ${SUBSCRIPTION_RENEWAL_REMINDERS_DAYS_BEFORE:7,3,1,0}
      cron: ${SUBSCRIPTION_RENEWAL_REMINDERS_CRON:0 0 8 * * *}
  notifications:
    email:
      enabled: ${EMAIL_ENABLED:false}
      from-address: ${EMAIL_FROM_ADDRESS:}
      from-name: ${EMAIL_FROM_NAME:AI Research Assistant}
    arkesel:
      enabled: ${ARKESEL_ENABLED:false}
      api-key: ${ARKESEL_API_KEY:}
      sender-id: ${ARKESEL_SENDER_ID:}
    firebase:
      enabled: ${FIREBASE_ENABLED:false}
      project-id: ${FIREBASE_PROJECT_ID:}
      access-token: ${FIREBASE_ACCESS_TOKEN:}
